
name: Azure VM Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    name: Check Nginx and HTTPS
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inspect server
        run: |
          az vm run-command invoke \
            --resource-group beauty-app-rg \
            --name TestingVM \
            --command-id RunShellScript \
            --scripts '
              echo "=== NGINX PROCESSES ==="
              ps -ef | grep "[n]ginx" || true

              echo "=== NGINX EXECUTABLE AND CGROUP ==="
              for pid in $(pgrep nginx); do
                echo "PID: $pid"
                readlink /proc/$pid/exe || true
                tr "\0" " " < /proc/$pid/cmdline || true
                echo
                echo "CGROUP:"
                head -n 3 /proc/$pid/cgroup || true
              done

              echo "=== FRONTEND NETWORK MODE ==="
              docker inspect beauty-frontend \
                --format "{{.HostConfig.NetworkMode}}" 2>&1 || true

              echo "=== FRONTEND CONTAINER ==="
              docker inspect beauty-frontend \
                --format "Name={{.Name}} Image={{.Config.Image}} Ports={{json .HostConfig.PortBindings}}" 2>&1 || true

              echo "=== LISTENING PORTS ==="
              ss -tlnp | grep -E ":(80|443|5173) " || true

              echo "=== NGINX CONFIG FILES ==="
              find /etc/nginx -maxdepth 3 -type f -name "*.conf" -print 2>&1 || true

              echo "=== HTTPS CERTIFICATES ==="
              ls -la /etc/letsencrypt/live 2>&1 || true
            ' \
            --query "value[0].message" -o tsv
