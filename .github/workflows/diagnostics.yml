
name: Azure VM Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    name: Check Nginx and HTTPS
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inspect server
        run: |
          az vm run-command invoke \
            --resource-group beauty-app-rg \
            --name TestingVM \
            --command-id RunShellScript \
            --scripts '
              echo "=== NGINX INSTALLATION ==="
              command -v nginx || true
              ls -ld /etc/nginx /etc/nginx/sites-enabled 2>&1 || true

              echo "=== NGINX CONFIG FILES ==="
              find /etc/nginx -maxdepth 3 -type f -name "*.conf" -print 2>&1 || true

              echo "=== NGINX CONFIGURATION ==="
              if [ -x /usr/sbin/nginx ]; then
                /usr/sbin/nginx -T 2>&1 | grep -E "server_name|listen|ssl_certificate|proxy_pass" || true
              else
                echo "Nginx binary not found at /usr/sbin/nginx"
              fi

              echo "=== HTTPS CERTIFICATES ==="
              ls -la /etc/letsencrypt/live 2>&1 || true

              echo "=== LISTENING PORTS ==="
              ss -tlnp | grep -E ":(80|443|5173) " || true

              echo "=== DOCKER CONTAINERS ==="
              docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}" || true

              echo "=== DOCKER GATEWAY ==="
              docker inspect loki_service-gateway-1 --format "{{.Name}} {{json .HostConfig.PortBindings}}" 2>&1 || true
            ' \
            --query "value[0].message" -o tsv
