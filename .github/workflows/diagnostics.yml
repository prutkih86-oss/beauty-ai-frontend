
name: Azure VM Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    name: Check Nginx and HTTPS
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inspect server
        run: |
          az vm run-command invoke \
            --resource-group beauty-app-rg \
            --name TestingVM \
            --command-id RunShellScript \
            --scripts '
              echo "=== CONTAINER IDS ==="
              docker ps --no-trunc \
                --format "{{.ID}} {{.Names}}" |
                grep -E "beauty-frontend|igor-frontend|loki_service-gateway" || true

              echo "=== FRONTEND NETWORK MODE ==="
              docker inspect beauty-frontend \
                --format "{{.HostConfig.NetworkMode}}" 2>&1 || true

              echo "=== NGINX ROUTING ==="
              docker exec beauty-frontend nginx -T 2>&1 |
                grep -E "server_name|listen|ssl_certificate |proxy_pass" || true

              echo "=== CERTIFICATE ON PORT 443 ==="
              timeout 8 openssl s_client \
                -connect 127.0.0.1:443 \
                -servername beautyaiserviceua.polandcentral.cloudapp.azure.com \
                </dev/null 2>/dev/null |
                openssl x509 -noout -subject -issuer -dates || true

              echo "=== LISTENING PORTS ==="
              ss -tlnp | grep -E ":(80|443|5173) " || true
            ' \
            --query "value[0].message" -o tsv

